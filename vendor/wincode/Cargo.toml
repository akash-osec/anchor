[package]
name = "wincode"
version = "0.6.1"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
description = "Fast bincode de/serialization with placement initialization"
repository = "https://github.com/anza-xyz/wincode"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.89.0"
categories = ["encoding", "network-programming"]
keywords = ["binary", "encode", "serialize", "deserialize", "bincode"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "-D", "warnings"]

[features]
default = ["std"]
alloc = []
bv = ["std", "dep:bv"]
bv-strict = ["bv"]
std = ["alloc", "thiserror/std"]
derive = ["dep:wincode-derive"]
indexmap = ["alloc", "dep:indexmap"]
uuid = ["dep:uuid"]
uuid-serde-compat = ["uuid"]
bytes = ["alloc", "dep:bytes"]
bytes-extra-platforms = ["bytes", "bytes/extra-platforms"]
ecow = ["alloc", "dep:ecow"]
smallvec = ["alloc", "dep:smallvec"]
bumpalo = ["alloc", "dep:bumpalo"]

[dependencies]
bumpalo = { version = "3.20.3", features = ["collections", "boxed"], optional = true }
bytes = { version = "1.11.1", optional = true, default-features = false }
bv = { version = "0.11.1", optional = true, default-features = false }
ecow = { version = "0.2.6", optional = true, default-features = false }
indexmap = { version = "2.13.1", optional = true, default-features = false }
pastey = "0.2.2"
smallvec = { version = "1.15.1", optional = true, default-features = false, features = ["const_generics"] }
thiserror = { version = "2.0.18", default-features = false }
wincode-derive = { version = "0.5", optional = true }
uuid = { version = "1.23.1", optional = true, default-features = false }

[build-dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"

[workspace]
